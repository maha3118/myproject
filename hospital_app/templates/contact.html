<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f9ff;
        }

        /* Navbar */

        .navbar{
            background:white;
            box-shadow:0 2px 15px rgba(0,0,0,0.08);
            padding:15px 0;
        }

        .navbar-brand{
            font-size:30px;
            font-weight:700;
            color:#0d6efd !important;
        }

        .nav-link{
            color:#222 !important;
            margin-left:20px;
            font-weight:500;
        }

        .nav-link:hover{
            color:#0d6efd !important;
        }

        /* Hero */

        .hero{
            background:linear-gradient(135deg,#0d6efd,#4da3ff);
            color:white;
            text-align:center;
            padding:90px 20px;
        }

        .hero h1{
            font-size:55px;
            font-weight:700;
        }

        .hero p{
            margin-top:15px;
            font-size:18px;
        }

        /* Contact Section */

        .contact-section{
            padding:80px 0;
        }

        .contact-card{
            background:white;
            border:none;
            border-radius:30px;
            padding:50px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .contact-title{
            font-size:40px;
            font-weight:700;
            color:#0a2148;
            margin-bottom:30px;
        }

        .contact-info{
            margin-bottom:25px;
            font-size:20px;
            color:#555;
        }

        .contact-info i{
            color:#0d6efd;
            margin-right:15px;
            font-size:24px;
        }

        .btn-home{
            background:#0d6efd;
            color:white;
            padding:14px 30px;
            border-radius:40px;
            text-decoration:none;
            display:inline-block;
            margin-top:20px;
            transition:0.3s;
            font-weight:600;
        }

        .btn-home:hover{
            background:#084298;
            color:white;
        }

        /* Contact Form */

        .form-control{
            border-radius:15px;
            padding:14px;
            margin-bottom:20px;
        }

        textarea{
            resize:none;
        }

        .btn-send{
            background:#0d6efd;
            color:white;
            border:none;
            padding:14px 35px;
            border-radius:40px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-send:hover{
            background:#084298;
        }

        /* Footer */

        footer{
            background:#081b38;
            color:white;
            text-align:center;
            padding:25px 0;
            margin-top:50px;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg sticky-top">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-hospital"></i>
            Medicare
        </a>

        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/doctors/">Doctors</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/services/">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/appointments/">Appointments</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/contact/">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Hero -->

<section class="hero">

    <h1>Contact Medicare Hospital</h1>

    <p>
        We are available 24/7 for your healthcare support.
    </p>

</section>

<!-- Contact Section -->

<section class="contact-section">

    <div class="container">

        <div class="row g-5 align-items-center">

            <!-- Left Side -->

            <div class="col-lg-6">

                <div class="contact-card">

                    <h2 class="contact-title">
                        Get In Touch
                    </h2>

                    <div class="contact-info">
                        <i class="fa-solid fa-phone"></i>
                        +91 9876543210
                    </div>

                    <div class="contact-info">
                        <i class="fa-solid fa-envelope"></i>
                        medicare@gmail.com
                    </div>

                    <div class="contact-info">
                        <i class="fa-solid fa-location-dot"></i>
                        Chennai, India
                    </div>

                    <a href="/" class="btn-home">
                        <i class="fa-solid fa-house"></i>
                        Go Home
                    </a>

                </div>

            </div>

            <!-- Right Side -->

            <div class="col-lg-6">

                <div class="contact-card">

                    <h2 class="contact-title">
                        Send Message
                    </h2>

                    <form>

                        <input type="text"
                            class="form-control"
                            placeholder="Enter Your Name">

                        <input type="email"
                            class="form-control"
                            placeholder="Enter Your Email">

                        <textarea rows="5"
                            class="form-control"
                            placeholder="Write Your Message"></textarea>

                        <button class="btn-send">
                            <i class="fa-solid fa-paper-plane"></i>
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Footer -->

<footer>

    <p>
        © 2026 Medicare Hospital | All Rights Reserved
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
